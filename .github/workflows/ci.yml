name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      # Root Vitest intentionally imports the pure mobile sync/API modules, so
      # the clean runner must also provide the Expo tsconfig they extend.
      - run: npm ci
        working-directory: mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile-quality:
    name: mobile-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm run doctor
        working-directory: mobile
      - run: npx expo export --platform android --output-dir dist-android
        working-directory: mobile
      - run: npx expo export --platform ios --output-dir dist-ios
        working-directory: mobile

  e2e-restore-roundtrip:
    name: e2e-restore-roundtrip
    runs-on: ubuntu-latest
    needs: web-quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Playwright（10 个独立 project）+ 灾难恢复 roundtrip（真实服务器 boot）
      - run: npx playwright test
      - run: npx vitest run --config vitest.roundtrip.config.ts
