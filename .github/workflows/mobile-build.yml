name: Native mobile packages
run-name: Native packages / ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full main commit SHA to package (empty uses the dispatch commit)"
        required: false
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: native-mobile-${{ github.ref }}-${{ inputs.source_sha || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 只核对源提交、记下版本号，十几秒就完。原生构建只等这一步，与两分钟的 quality 并行；
  # GitHub Release 仍要等 quality、全部构建和两组 iOS 验证都通过。
  source:
    name: Package source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify main-only source
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$GITHUB_REF_TYPE" = "tag"
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            # 标签必须等于 app.json 的版本（后缀之前），免得 v1.2.0 里装的是 1.1.x。
            APP_VERSION=$(python3 -c 'import json;print(json.load(open("mobile/app.json"))["expo"]["version"])')
            test "${GITHUB_REF_NAME%%-*}" = "v$APP_VERSION" || { echo "Tag $GITHUB_REF_NAME does not match mobile/app.json version $APP_VERSION"; exit 1; }
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Package application source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Record package source
        run: |
          python3 - <<'PY'
          import json, subprocess
          native = json.load(open("mobile/app.json"))["expo"]
          source = {"gitSha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "version": native["version"], "androidVersionCode": native["android"]["versionCode"],
                    "iosBuildNumber": native["ios"]["buildNumber"]}
          with open("build-source.json", "w") as out:
              json.dump(source, out, indent=2)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-build-source
          path: build-source.json
          if-no-files-found: error
          retention-days: 30

  quality:
    name: React Native quality
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      # tests/sync-e2e.test.ts 拉起真实服务端子进程，所以 server 也要装一次依赖。
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: mobile
      - run: npm run lint
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run doctor
        working-directory: mobile
      # 出包路径必须和 ci.yml 一样守住「本机边界」宪法与服务端测试：
      # 这里只校验 source_sha 是 origin/main 的祖先，并不校验那个提交的 CI 是否绿。
      - name: Verify local architecture and fixture syntax
        run: |
          python3 -m py_compile mobile/scripts/*.py
          python3 -m unittest discover -s mobile/scripts -p 'test_*.py'
          python3 mobile/scripts/verify-local-boundary.py
      - run: npm test
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npx expo export --platform android --output-dir dist-android
        working-directory: mobile
      - run: npx expo export --platform ios --output-dir dist-ios
        working-directory: mobile

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: mobile
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: mobile
        env:
          CI: "1"
      # 编译缓存：安卓的原生部分（新架构的 appmodules，Reanimated／Worklets／Expo 等各库自己的 CMake
      # 目标，两种 ABI 各一份）同样经 ccache。CMake 3.17 起认 CMAKE_<LANG>_COMPILER_LAUNCHER 环境变量，
      # AGP 调 CMake 时原样带着，所以只在构建这一步设它们，所有库一起生效。ccache 不放进 PATH：
      # React Native 的 ReactNative-application.cmake 在 PATH 上找到 ccache 会再套一层。
      # NDK 每次构建现装，编译器文件的修改时间次次不同，所以按 `clang -v` 的输出认编译器；
      # 工作区路径固定，但 .cxx 下的配置目录名由 AGP 算出，不在哈希里带工作目录（hash_dir = false），
      # 调试信息里的目录可能不准，发布包里的 .so 本来就剥掉了调试信息。
      # 与 iOS 不同，这里设回退键：没有 modules 宽松项，ccache 逐个核对头文件，旧依赖的结果只会不命中、不会误用。
      # Reanimated、Worklets、expo-modules-core 用预编译头，不开 pch_defines,time_macros 时 ccache 一律不缓存
      # （run 35832730488：598 次里 408 次「Could not use precompiled header」）。Reanimated 自带
      # -Xclang -fno-pch-timestamp，预编译头可复现，能命中；另两个的预编译头记着头文件修改时间，
      # ccache 4.14 对这种情况逐个核对修改时间、预处理模式也不复用 clang 的预编译头，只会不命中，不会拿旧的凑数。
      # 键里的 v2 跟着这份配置走：精确命中的键不会再保存，改配置不换键，新进缓存的内容永远存不下来。
      - name: Install ccache
        id: ccache
        env:
          CCACHE_VERSION: "4.14"
          CCACHE_SHA256: c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache.tar.gz" \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-linux-x86_64-glibc.tar.gz"
          echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          BIN="$RUNNER_TEMP/ccache-bin"
          CACHE_DIR="$HOME/.cache/ccache"
          mkdir -p "$BIN"
          install -m 0755 "$RUNNER_TEMP/ccache-$CCACHE_VERSION-linux-x86_64-glibc/ccache" "$BIN/ccache"
          cat > "$BIN/ccache.conf" <<EOF
          cache_dir = $CACHE_DIR
          compiler_check = %compiler% -v
          hash_dir = false
          max_size = 2G
          sloppiness = pch_defines,time_macros
          EOF
          echo "CCACHE_CONFIGPATH=$BIN/ccache.conf" >> "$GITHUB_ENV"
          "$BIN/ccache" --version | head -n 1
          echo "bin=$BIN/ccache" >> "$GITHUB_OUTPUT"
          echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-android-v2-${{ hashFiles('mobile/package-lock.json', 'mobile/plugins/**', 'mobile/modules/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-android-
      - name: Build installable standalone APK
        run: |
          "$RUNNER_TEMP/ccache-bin/ccache" --zero-stats > /dev/null
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
        working-directory: mobile/android
        env:
          NODE_ENV: production
          CMAKE_C_COMPILER_LAUNCHER: ${{ steps.ccache.outputs.bin }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outputs.bin }}
      - name: Show compiler cache statistics
        if: always()
        run: '"$RUNNER_TEMP/ccache-bin/ccache" --show-stats --verbose || true'
      - name: Sign with the owner release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 密钥不存在时退回 runner 模板 debug 证书（只限手动试验构建）；打标签发布必须用持有者的密钥。
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "Release key missing on a tag build; refusing to publish a debug-signed APK."
              exit 1
            fi
            echo "No release key configured; keeping the template debug signature."
            exit 0
          fi
          SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Verify native Android package
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE=$(node -p "require('./mobile/app.json').expo.android.versionCode")
          EXPECTED_VERSION=$(node -p "require('./mobile/app.json').expo.version")
          SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)
          AAPT2=$(find "$SDK_ROOT/build-tools" -type f -name aapt2 -print | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -n "$AAPT2"
          SIGNATURE_REPORT=$("$APKSIGNER" verify --verbose "$APK")
          echo "$SIGNATURE_REPORT"
          echo "$SIGNATURE_REPORT" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          # 覆盖安装要求签名一致。钉住持有者私有 release 证书指纹；密钥缺失退回
          # 模板 debug 证书时校验其指纹。行前缀随 build-tools 版本变化，只匹配摘要值。
          CERT_REPORT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT_REPORT"
          PINNED_DIGEST='certificate SHA-256 digest: fe5743e447780272340901fbed4df95f2a545e7778bff6852771dea352f4b17e'
          TEMPLATE_DIGEST='certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c'
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "$CERT_REPORT" | grep -F "$PINNED_DIGEST"
          else
            echo "$CERT_REPORT" | grep -F "$PINNED_DIGEST" || { echo "$CERT_REPORT" | grep -F "$TEMPLATE_DIGEST" && echo "::warning::APK carries the template debug signature; do not deliver it."; }
          fi
          "$AAPT2" dump badging "$APK" | grep -F "package: name='app.familytimecapsule.mobile'"
          "$AAPT2" dump badging "$APK" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          "$AAPT2" dump badging "$APK" | grep -F "versionName='$EXPECTED_VERSION'"
          MANIFEST_REPORT=$("$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml)
          echo "$MANIFEST_REPORT" | grep -F 'android.intent.action.SEND'
          echo "$MANIFEST_REPORT" | grep -F 'android.intent.action.SEND_MULTIPLE'
          echo "$MANIFEST_REPORT" | grep -F 'application/pdf'
          echo "$MANIFEST_REPORT" | grep -F 'android.permission.INTERNET'
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'
      - name: Enable KVM for Android verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline Release app on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 mobile/scripts/smoke-android.py mobile/android/app/build/outputs/apk/release/app-release.apk --output mobile/build/android-smoke
      - name: Preserve Android native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-android-local-regression
          path: mobile/build/android-smoke/
          if-no-files-found: error
          retention-days: 30
      - name: Name package
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk FamilyTimeCapsule-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-android-apk
          path: FamilyTimeCapsule-android.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS unsigned IPA
    runs-on: macos-26
    needs: source
    env:
      # Expo SDK 57 requires Xcode >= 26.4. The macos-26 image includes this
      # pinned stable toolchain while macos-15 currently tops out at 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Xcode toolchain
        id: xcode
        run: |
          xcodebuild -version
          swift --version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: mobile
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
        working-directory: mobile
        env:
          CI: "1"
      # Cache downloads only; pod-install still resolves and integrates this source.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-${{ runner.arch }}-pods-xcode26.6-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/plugins/**', 'mobile/modules/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pods-xcode26.6-
      # 编译缓存：构建时在 xcodebuild 命令行上把 CC 指向下面生成的 ccache-clang，所有 target 的
      # C／C++／Objective-C++ 编译都经 ccache；链接和 Swift 照旧。这一步的大头是 Reanimated／SVG／
      # Screens／Worklets 等四百多个 C++／Objective-C++ 文件，依赖不变时整份命中。
      # 不用 React Native 的 USE_CCACHE=1（run 35815958870 两处都坏）：它把
      # $(REACT_NATIVE_PATH)/…/ccache-clang.sh 写进工程级 CC／LD，分享扩展不走 CocoaPods、没有
      # PODS_ROOT，链接路径拼成 /../../node_modules/…；它的封装又靠 $CCACHE_BINARY 找 ccache，
      # Xcode 26 的编译任务拿不到构建设置环境变量，编译直接走了 clang。所以这里的封装把 ccache、
      # 配置、缓存目录和真正的 clang 全写成绝对路径；配置与 React Native 的 scripts/xcode/ccache.conf
      # 同一套（depend 模式、modules 等宽松项）。键钉住依赖锁文件、本地原生代码与 Xcode 构建号，
      # 不设回退键：依赖一变就完整冷编一次，不拿旧依赖的结果凑数（modules 宽松模式察觉不到
      # 模块内部的变化，系统头文件也不进清单）。
      - name: Install ccache
        id: ccache
        env:
          CCACHE_VERSION: "4.14"
          CCACHE_SHA256: 353a81ea8680d93387102cfde288ebed381a54272cfdc18224f241add6332b39
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache.tar.gz" \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz"
          echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          BIN="$RUNNER_TEMP/ccache-bin"
          CACHE_DIR="$HOME/Library/Caches/ccache"
          CLANG=$(xcrun --find clang)
          test -x "$CLANG"
          mkdir -p "$BIN"
          install -m 0755 "$RUNNER_TEMP/ccache-$CCACHE_VERSION-darwin/ccache" "$BIN/ccache"
          cat > "$BIN/ccache.conf" <<EOF
          cache_dir = $CACHE_DIR
          sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          file_clone = true
          depend_mode = true
          inode_cache = true
          EOF
          cat > "$BIN/ccache-clang" <<EOF
          #!/bin/sh
          export CCACHE_CONFIGPATH='$BIN/ccache.conf'
          exec '$BIN/ccache' '$CLANG' "\$@"
          EOF
          chmod +x "$BIN/ccache-clang"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "CCACHE_CONFIGPATH=$BIN/ccache.conf" >> "$GITHUB_ENV"
          "$BIN/ccache" --version | head -n 1
          cat "$BIN/ccache-clang"
          echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-ios-device-${{ steps.xcode.outputs.build }}-${{ hashFiles('mobile/package-lock.json', 'mobile/plugins/**', 'mobile/modules/**') }}
      - name: Install CocoaPods
        run: npx pod-install ios
        working-directory: mobile
      - name: Create unsigned device archive
        working-directory: mobile
        run: |
          ccache --zero-stats > /dev/null
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE_PATH"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE_PATH" | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("workspace", "schemes").first')
          test -n "$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FamilyTimeCapsule.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CC="$RUNNER_TEMP/ccache-bin/ccache-clang" \
            archive
      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose || true
      - name: Package unsigned IPA
        working-directory: mobile
        run: |
          APP_PATH=$(find build/FamilyTimeCapsule.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          EXPECTED_BUILD_NUMBER=$(node -p "require('./app.json').expo.ios.buildNumber")
          EXPECTED_VERSION=$(node -p "require('./app.json').expo.version")
          test -n "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = 'app.familytimecapsule.mobile'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "$EXPECTED_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "$EXPECTED_VERSION"
          test -f "$APP_PATH/main.jsbundle"
          APPEX_PATH=$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' -print -quit)
          test -n "$APPEX_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX_PATH/Info.plist")" = 'app.familytimecapsule.mobile.share'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APPEX_PATH/Info.plist")" = "$EXPECTED_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APPEX_PATH/Info.plist")" = "$EXPECTED_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/app/app.entitlements)" = 'group.app.familytimecapsule.mobile.share'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/FamilyShareExtension/FamilyShareExtension.entitlements)" = 'group.app.familytimecapsule.mobile.share'
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          APPEX_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APPEX_PATH/Info.plist")
          lipo -archs "$APP_PATH/$APP_EXECUTABLE" | tr ' ' '\n' | grep -Fx arm64
          lipo -archs "$APPEX_PATH/$APPEX_EXECUTABLE" | tr ' ' '\n' | grep -Fx arm64
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../FamilyTimeCapsule-ios-unsigned.ipa Payload
          /usr/bin/unzip -tq ../FamilyTimeCapsule-ios-unsigned.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-ios-unsigned-ipa
          path: mobile/build/FamilyTimeCapsule-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-26
    needs: source
    env:
      # Expo SDK 57 requires Xcode >= 26.4. The macos-26 image includes this
      # pinned stable toolchain while macos-15 currently tops out at 26.3.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify Xcode toolchain
        id: xcode
        run: |
          xcodebuild -version
          swift --version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: mobile
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
        working-directory: mobile
        env:
          CI: "1"
      # Cache downloads only; pod-install still resolves and integrates this source.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-${{ runner.arch }}-pods-xcode26.6-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/plugins/**', 'mobile/modules/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pods-xcode26.6-
      # 编译缓存：构建时在 xcodebuild 命令行上把 CC 指向下面生成的 ccache-clang，所有 target 的
      # C／C++／Objective-C++ 编译都经 ccache；链接和 Swift 照旧。这一步的大头是 Reanimated／SVG／
      # Screens／Worklets 等四百多个 C++／Objective-C++ 文件，依赖不变时整份命中。
      # 不用 React Native 的 USE_CCACHE=1（run 35815958870 两处都坏）：它把
      # $(REACT_NATIVE_PATH)/…/ccache-clang.sh 写进工程级 CC／LD，分享扩展不走 CocoaPods、没有
      # PODS_ROOT，链接路径拼成 /../../node_modules/…；它的封装又靠 $CCACHE_BINARY 找 ccache，
      # Xcode 26 的编译任务拿不到构建设置环境变量，编译直接走了 clang。所以这里的封装把 ccache、
      # 配置、缓存目录和真正的 clang 全写成绝对路径；配置与 React Native 的 scripts/xcode/ccache.conf
      # 同一套（depend 模式、modules 等宽松项）。键钉住依赖锁文件、本地原生代码与 Xcode 构建号，
      # 不设回退键：依赖一变就完整冷编一次，不拿旧依赖的结果凑数（modules 宽松模式察觉不到
      # 模块内部的变化，系统头文件也不进清单）。
      - name: Install ccache
        id: ccache
        env:
          CCACHE_VERSION: "4.14"
          CCACHE_SHA256: 353a81ea8680d93387102cfde288ebed381a54272cfdc18224f241add6332b39
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache.tar.gz" \
            "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-darwin.tar.gz"
          echo "$CCACHE_SHA256  $RUNNER_TEMP/ccache.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          BIN="$RUNNER_TEMP/ccache-bin"
          CACHE_DIR="$HOME/Library/Caches/ccache"
          CLANG=$(xcrun --find clang)
          test -x "$CLANG"
          mkdir -p "$BIN"
          install -m 0755 "$RUNNER_TEMP/ccache-$CCACHE_VERSION-darwin/ccache" "$BIN/ccache"
          cat > "$BIN/ccache.conf" <<EOF
          cache_dir = $CACHE_DIR
          sloppiness = clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          file_clone = true
          depend_mode = true
          inode_cache = true
          EOF
          cat > "$BIN/ccache-clang" <<EOF
          #!/bin/sh
          export CCACHE_CONFIGPATH='$BIN/ccache.conf'
          exec '$BIN/ccache' '$CLANG' "\$@"
          EOF
          chmod +x "$BIN/ccache-clang"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "CCACHE_CONFIGPATH=$BIN/ccache.conf" >> "$GITHUB_ENV"
          "$BIN/ccache" --version | head -n 1
          cat "$BIN/ccache-clang"
          echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ steps.ccache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-ios-simulator-${{ steps.xcode.outputs.build }}-${{ hashFiles('mobile/package-lock.json', 'mobile/plugins/**', 'mobile/modules/**') }}
      - name: Install CocoaPods
        run: npx pod-install ios
        working-directory: mobile
      - name: Compile Release UI regression runner
        if: hashFiles('mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        run: |
          if ! ruby -rxcodeproj -e 'exit 0'; then
            gem install --user-install xcodeproj --version 1.27.0 --no-document
          fi
          mkdir -p build
          ruby scripts/ios-regression/create-project.rb build/native-runner-project
          if ! xcodebuild \
            -project build/native-runner-project/NativeRegression.xcodeproj -scheme NativeRegression \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/native-runner CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            build-for-testing > build/native-runner-build.log 2>&1; then
            tail -n 160 build/native-runner-build.log
            exit 1
          fi
      # Historical pinned checkouts may predate this native startup regression.
      - name: Build release iOS simulator app
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        run: |
          ccache --zero-stats > /dev/null
          WORKSPACE_PATH=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE_PATH"
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE_PATH" | ruby -rjson -e 'puts JSON.parse(STDIN.read).dig("workspace", "schemes").first')
          test -n "$SCHEME"
          mkdir -p build
          if ! xcodebuild \
            -workspace "$WORKSPACE_PATH" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            CC="$RUNNER_TEMP/ccache-bin/ccache-clang" \
            build > build/simulator-build.log 2>&1; then
            tail -n 160 build/simulator-build.log
            exit 1
          fi
      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose || true
      - name: Bundle simulator test inputs
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        run: |
          APP_PATH=$(find build/simulator/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          SIM_ENTITLEMENTS=$(find build/simulator/Build/Intermediates.noindex -name "$(basename "$APP_PATH")-Simulated.xcent" -print -quit)
          test -n "$SIM_ENTITLEMENTS"
          mkdir -p build/ios-test-inputs
          cp -R "$APP_PATH" build/ios-test-inputs/
          cp "$SIM_ENTITLEMENTS" build/ios-test-inputs/simulator-entitlements.plist
          cp build/simulator-build.log build/ios-test-inputs/
          git rev-parse HEAD > build/ios-test-inputs/source-sha.txt
          uname -m > build/ios-test-inputs/architecture.txt
          xcodebuild -version > build/ios-test-inputs/xcode-version.txt
          # Tar preserves executable bits and framework symlinks across runners.
          INPUTS=(ios-test-inputs)
          if [ -f scripts/smoke-ios-regression.py ]; then
            INPUTS+=(native-runner/Build/Products)
          fi
          tar -czf build/ios-simulator-tests.tar.gz -C build "${INPUTS[@]}"
      - uses: actions/upload-artifact@v7
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        with:
          name: FamilyTimeCapsule-ios-simulator-tests
          path: mobile/build/ios-simulator-tests.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve simulator build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-ios-simulator-build
          path: mobile/build/*-build.log
          if-no-files-found: warn
          retention-days: 30

  # 两组验证与模拟器构建同时起跑：冷 runner 上建模拟器、启动、热身要三四分钟，
  # 放在构建的那几分钟里做完，构建一传上测试包就接着装应用。构建失败或被取消，这里跟着失败。
  ios-check:
    name: iOS ${{ matrix.check }} verification
    runs-on: macos-26
    needs: source
    # 等构建要查本次运行里作业的状态。
    permissions:
      contents: read
      actions: read
    strategy:
      # Keep the other evidence bundle even if one suite fails.
      fail-fast: false
      matrix:
        check: [startup, regression]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      # 更早的提交没有 prepare：跳过这步，冒烟脚本照旧自己建模拟器。
      - name: Boot a simulator while the app builds
        id: simulator
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        env:
          SIMULATOR_NAME: ${{ matrix.check == 'startup' && 'FTC release startup smoke' || 'Anan offline regression' }}
          EVIDENCE: ${{ matrix.check == 'startup' && 'build/startup-smoke' || 'build/native-regression' }}
        run: |
          if ! grep -qF '"prepare"' scripts/ios_simulator.py; then
            echo "This checkout predates simulator preparation; the smoke script boots its own."
            exit 0
          fi
          python3 scripts/ios_simulator.py prepare --name "$SIMULATOR_NAME" --output "$EVIDENCE" --udid-file "$RUNNER_TEMP/simulator-udid"
          echo "udid=$(cat "$RUNNER_TEMP/simulator-udid")" >> "$GITHUB_OUTPUT"
      # 按作业状态等，不按产物等：重跑整个运行时，上一轮同名的测试包还在列表里。
      # 只重跑失败作业时，没重跑的构建作业沿用上一轮的成功结果，这里立刻放行。
      - name: Wait for the simulator build
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_JOB: iOS simulator build
        run: |
          started=$SECONDS
          blind=0
          while true; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
              --jq "first(.jobs[] | select(.name == \"$BUILD_JOB\")) | \"\(.status) \(.conclusion // \"\")\"") || state=""
            waited=$((SECONDS - started))
            case "$state" in
              "completed success")
                echo "$BUILD_JOB finished; waited ${waited}s"
                break ;;
              completed*)
                echo "::error::$BUILD_JOB ended as '${state#completed }'; there is no app to verify"
                exit 1 ;;
              "")
                # 接口偶尔出错不要紧；连着五分钟查不到这个作业，就别再干等。
                blind=$((blind + 1))
                if (( blind >= 15 )); then
                  echo "::error::Could not read the state of '$BUILD_JOB' for five minutes"
                  exit 1
                fi ;;
              *)
                blind=0 ;;
            esac
            if (( waited > 5400 )); then
              echo "::error::Gave up after ${waited}s waiting for $BUILD_JOB (last state: $state)"
              exit 1
            fi
            sleep 20
          done
      - uses: actions/download-artifact@v7
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        with:
          name: FamilyTimeCapsule-ios-simulator-tests
          path: mobile/build
      - name: Restore and verify simulator test inputs
        if: hashFiles('mobile/scripts/smoke-ios-startup.py', 'mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        run: |
          tar -xzf build/ios-simulator-tests.tar.gz -C build
          test "$(cat build/ios-test-inputs/source-sha.txt)" = "$SOURCE_SHA"
          test "$(cat build/ios-test-inputs/architecture.txt)" = "$(uname -m)"
          test "$(cat build/ios-test-inputs/xcode-version.txt)" = "$(xcodebuild -version)"
      - name: Verify native local-mode startup and relaunch
        if: matrix.check == 'startup' && hashFiles('mobile/scripts/smoke-ios-startup.py') != ''
        working-directory: mobile
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP_PATH=$(find build/ios-test-inputs -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          SIM_ENTITLEMENTS=build/ios-test-inputs/simulator-entitlements.plist
          test -f "$SIM_ENTITLEMENTS"
          python3 scripts/smoke-ios-startup.py "$APP_PATH" --entitlements "$SIM_ENTITLEMENTS" --output build/startup-smoke \
            ${SIMULATOR_UDID:+--udid "$SIMULATOR_UDID"}
      - name: Preserve native startup evidence
        if: always() && matrix.check == 'startup' && hashFiles('mobile/scripts/smoke-ios-startup.py') != ''
        uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-ios-startup-smoke
          path: |
            mobile/build/startup-smoke/
            mobile/build/ios-test-inputs/simulator-build.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify Release playback and layout with XCUITest
        id: ios-regression
        if: matrix.check == 'regression' && hashFiles('mobile/scripts/smoke-ios-regression.py') != ''
        working-directory: mobile
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP_PATH=$(find build/ios-test-inputs -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          python3 scripts/smoke-ios-regression.py "$APP_PATH" --runner-build build/native-runner --output build/native-regression \
            ${SIMULATOR_UDID:+--udid "$SIMULATOR_UDID"}
      # 模拟器没启动起来时回归这步不会跑，启动日志也要留下。
      - name: Preserve local native regression evidence
        if: always() && matrix.check == 'regression' && (steps.ios-regression.outcome != 'skipped' || steps.simulator.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: FamilyTimeCapsule-ios-local-regression
          path: mobile/build/native-regression/
          if-no-files-found: error
          retention-days: 30

  release:
    # 只有 v* 标签才发 GitHub Release：三份产物 + build-source.json + sha256sums.txt，
    # 说明取 CHANGELOG 最上面一节。写权限只给这一作业。
    name: GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [source, quality, android, ios, ios-simulator, ios-check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: actions/download-artifact@v7
        with:
          pattern: FamilyTimeCapsule-{build-source,android-apk,ios-unsigned-ipa}
          path: artifacts
      - name: Collect release files and checksums
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
        run: |
          mkdir release
          cp artifacts/FamilyTimeCapsule-android-apk/FamilyTimeCapsule-android.apk release/
          cp artifacts/FamilyTimeCapsule-ios-unsigned-ipa/FamilyTimeCapsule-ios-unsigned.ipa release/
          cp artifacts/FamilyTimeCapsule-build-source/build-source.json release/
          test "$(node -p "require('./release/build-source.json').gitSha")" = "$SOURCE_SHA"
          (cd release && sha256sum FamilyTimeCapsule-android.apk FamilyTimeCapsule-ios-unsigned.ipa build-source.json > sha256sums.txt && cat sha256sums.txt)
          python3 - <<'PY'
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          sections = re.split(r"^## ", text, flags=re.M)[1:]
          top = ("## " + sections[0]).rstrip() if sections else "见 CHANGELOG.md。"
          with open("release-notes.md", "w", encoding="utf-8") as out:
              out.write(top + "\n\n源提交 `" + open("release/build-source.json").read().split('"gitSha": "')[1].split('"')[0] + "`。"
                        "IPA 未签名，由持有者自签后装机；校验和见 sha256sums.txt。\n")
          PY
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --notes-file release-notes.md
