services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: family-time-capsule
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      # 认证会话密钥，必须在部署机的 .env 中设置（openssl rand -base64 32）
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 设置 AUTH_SECRET}
      # Better Auth 的唯一外部 origin；直连填写 http://服务器:端口，
      # 反向代理填写最终 https 地址。缺失时登录会安全拒绝而不是猜测 Host。
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?请设置 BETTER_AUTH_URL 为浏览器访问地址}
      # 首次初始化 /setup 的一次性令牌；初始化完成后建议移除
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:-}
      # 对外地址（反向代理 + HTTPS 时设置），例如：
      # BETTER_AUTH_URL: https://capsule.example.com
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-}
    volumes:
      # 原件、衍生物、导出与数据库全部落在这个卷里，重建容器不丢数据
      - capsule-data:/data
    healthcheck:
      test: ["CMD", "node", "/app/ops/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker:
    image: family-time-capsule
    command: ["node", "/app/ops/worker.mjs"]
    # The shared image probes the app's HTTP endpoint. A queue worker does not
    # listen on port 3000, so use process liveness here; durable worker
    # heartbeats provide the separate queue-level freshness signal.
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      DATA_DIR: /data
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-}
      AI_WORKER_POLL_MS: ${AI_WORKER_POLL_MS:-1000}
    volumes:
      - capsule-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  capsule-data:
