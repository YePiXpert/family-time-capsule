name: ${FTC_PROJECT_NAME}

services:
  app:
    image: ${FTC_IMAGE:?请在 env 设置已验证的 FTC_IMAGE（含 digest）}
    # 已有反向代理的机器：只绑定环回地址，由外部代理转发。
    ports:
      - "127.0.0.1:${FTC_LOOPBACK_PORT:?请在 env 设置 FTC_LOOPBACK_PORT}:3000"
    environment:
      DATA_DIR: /data
      AUTH_SECRET: ${AUTH_SECRET:?请在 env 设置 AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?请设置为最终 https 地址}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:-}
      AI_CONFIGURATION_ID: ${AI_CONFIGURATION_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-}
      AI_TOKEN_PARAMETER: ${AI_TOKEN_PARAMETER:-}
      AI_TEMPERATURE_SUPPORTED: ${AI_TEMPERATURE_SUPPORTED:-}
      AI_JSON_MODE: ${AI_JSON_MODE:-}
      AI_TRANSCRIPTION_FORMAT: ${AI_TRANSCRIPTION_FORMAT:-}
      ASR_CONFIGURATION_ID: ${ASR_CONFIGURATION_ID:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_PROVIDER_LABEL: ${ASR_PROVIDER_LABEL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      ASR_REQUEST_TIMEOUT_MS: ${ASR_REQUEST_TIMEOUT_MS:-}
      ASR_MAX_REQUEST_BYTES: ${ASR_MAX_REQUEST_BYTES:-}
      ASR_MAX_RESPONSE_BYTES: ${ASR_MAX_RESPONSE_BYTES:-}
    volumes:
      - capsule-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "node", "/app/ops/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  worker:
    image: ${FTC_IMAGE:?}
    command: ["node", "/app/ops/worker.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      DATA_DIR: /data
      AI_CONFIGURATION_ID: ${AI_CONFIGURATION_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_LABEL: ${AI_PROVIDER_LABEL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
      AI_MAX_REQUEST_BYTES: ${AI_MAX_REQUEST_BYTES:-}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-}
      AI_TOKEN_PARAMETER: ${AI_TOKEN_PARAMETER:-}
      AI_TEMPERATURE_SUPPORTED: ${AI_TEMPERATURE_SUPPORTED:-}
      AI_JSON_MODE: ${AI_JSON_MODE:-}
      AI_TRANSCRIPTION_FORMAT: ${AI_TRANSCRIPTION_FORMAT:-}
      ASR_CONFIGURATION_ID: ${ASR_CONFIGURATION_ID:-}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_PROVIDER_LABEL: ${ASR_PROVIDER_LABEL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      ASR_REQUEST_TIMEOUT_MS: ${ASR_REQUEST_TIMEOUT_MS:-}
      ASR_MAX_REQUEST_BYTES: ${ASR_MAX_REQUEST_BYTES:-}
      ASR_MAX_RESPONSE_BYTES: ${ASR_MAX_RESPONSE_BYTES:-}
    volumes:
      - capsule-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  capsule-data:
    name: ${FTC_DATA_VOLUME:?}
    external: true
