name: ${FTC_PROJECT_NAME}

services:
  app:
    image: ${FTC_IMAGE:?请在 env 设置已验证的 FTC_IMAGE（含 digest）}
    # 仅内部网络可达；对外只由 caddy 经 HTTPS 暴露。
    expose:
      - "3000"
    environment:
      DATA_DIR: /data
      AUTH_SECRET: ${AUTH_SECRET:?请在 env 设置 AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?请设置为最终 https 地址}
      INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    volumes:
      - capsule-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "node", "/app/ops/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

  worker:
    image: ${FTC_IMAGE:?}
    command: ["node", "/app/ops/worker.mjs"]
    # 无 HTTP 端口；进程存活 + 有界心跳（ftc doctor）共同判断。
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      DATA_DIR: /data
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
    volumes:
      - capsule-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    environment:
      FTC_DOMAIN: ${FTC_DOMAIN:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  backup-hook:
    # 维护门禁（升级/备份时启用）：只读返回 503，保护停写窗口。
    image: caddy:2-alpine
    profiles: ["maintenance"]
    volumes:
      - ./maintenance.Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: "no"
    networks:
      - internal

volumes:
  capsule-data:
    name: ${FTC_DATA_VOLUME:?}
    external: true
  caddy-data:
  caddy-config:

networks:
  internal:
    name: ${FTC_PROJECT_NAME}-internal
