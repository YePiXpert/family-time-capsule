# Family Time Capsule — 已有 Nginx 反代时的可审查片段（loopback 模式）。
# 放入 conf.d 或 include 到对应 server{} 中；只转发到 127.0.0.1:FTC_LOOPBACK_PORT。
# 请将 FTC_LOOPBACK_PORT 替换为 install 生成的实际端口。

location / {
    proxy_pass http://127.0.0.1:FTC_LOOPBACK_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 大媒体上传与断点续传。
    client_max_body_size 512m;
    proxy_request_buffering off;

    # 长事务（上传/渲染下载）边界。
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}

# 访问日志不记录携带令牌的请求行。
map $request_uri $ftc_loggable {
    ~^/invite/     0;
    ~^/contribute/ 0;
    ~^/respond/    0;
    default        1;
}
# 在 http{} 级别配合：
# access_log /var/log/nginx/access.log combined if=$ftc_loggable;
